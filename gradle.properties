# JVM args for Gradle daemon — bump heap so KAPT/Compose compiler do not OOM
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseG1GC

# Parallel + caching speeds up clean builds significantly.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is the only supported set of support libs now.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Suppress the noisy "unstable API" warnings for AGP 8.x.
android.suppressUnsupportedCompileSdk=35

# Kotlin code style for IDE.
kotlin.code.style=official

# Don't enforce JVM target for tests (helps with mixed-JDK environments).
kotlin.daemon.useFallbackStrategy=false
